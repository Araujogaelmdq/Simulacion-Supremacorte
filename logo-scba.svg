<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#2c5aa0" stroke-width="2"/>
  
  <!-- Building base -->
  <rect x="55" y="130" width="90" height="8" fill="#2c5aa0" rx="1"/>
  <rect x="60" y="138" width="80" height="4" fill="#2c5aa0" rx="1"/>
  
  <!-- Columns -->
  <rect x="68" y="90" width="6" height="40" fill="#2c5aa0"/>
  <rect x="82" y="90" width="6" height="40" fill="#2c5aa0"/>
  <rect x="97" y="90" width="6" height="40" fill="#2c5aa0"/>
  <rect x="112" y="90" width="6" height="40" fill="#2c5aa0"/>
  <rect x="126" y="90" width="6" height="40" fill="#2c5aa0"/>
  
  <!-- Column bases -->
  <rect x="65" y="128" width="12" height="4" fill="#2c5aa0" rx="1"/>
  <rect x="79" y="128" width="12" height="4" fill="#2c5aa0" rx="1"/>
  <rect x="94" y="128" width="12" height="4" fill="#2c5aa0" rx="1"/>
  <rect x="109" y="128" width="12" height="4" fill="#2c5aa0" rx="1"/>
  <rect x="123" y="128" width="12" height="4" fill="#2c5aa0" rx="1"/>
  
  <!-- Column tops -->
  <rect x="65" y="87" width="12" height="4" fill="#2c5aa0" rx="1"/>
  <rect x="79" y="87" width="12" height="4" fill="#2c5aa0" rx="1"/>
  <rect x="94" y="87" width="12" height="4" fill="#2c5aa0" rx="1"/>
  <rect x="109" y="87" width="12" height="4" fill="#2c5aa0" rx="1"/>
  <rect x="123" y="87" width="12" height="4" fill="#2c5aa0" rx="1"/>
  
  <!-- Triangular pediment -->
  <polygon points="50,87 100,55 150,87" fill="none" stroke="#2c5aa0" stroke-width="3"/>
  <line x1="50" y1="87" x2="150" y2="87" stroke="#2c5aa0" stroke-width="3"/>
  
  <!-- Dome/roof -->
  <path d="M 85,55 Q 100,25 115,55" fill="none" stroke="#2c5aa0" stroke-width="2.5"/>
  
  <!-- Dome top ornament -->
  <line x1="100" y1="30" x2="100" y2="22" stroke="#2c5aa0" stroke-width="2"/>
  <circle cx="100" cy="20" r="3" fill="#2c5aa0"/>
  
  <!-- Scale of justice on top -->
  <line x1="90" y1="38" x2="110" y2="38" stroke="#2c5aa0" stroke-width="1.5"/>
  <line x1="100" y1="30" x2="100" y2="38" stroke="#2c5aa0" stroke-width="1.5"/>
  
  <!-- Scale pans -->
  <path d="M 87,38 L 84,45 L 90,45 Z" fill="#2c5aa0"/>
  <path d="M 113,38 L 110,45 L 116,45 Z" fill="#2c5aa0"/>
  
  <!-- Steps -->
  <rect x="45" y="142" width="110" height="4" fill="#2c5aa0" rx="1"/>
  <rect x="40" y="146" width="120" height="4" fill="#2c5aa0" rx="1"/>
  <rect x="35" y="150" width="130" height="4" fill="#2c5aa0" rx="1"/>
  
  <!-- Text arc "JUSTICIA" -->
  <path id="textArc" d="M 30,165 Q 100,185 170,165" fill="none"/>
  <text font-family="Georgia, serif" font-size="11" fill="#2c5aa0" font-weight="bold">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">PROVINCIA DE BUENOS AIRES</textPath>
  </text>
</svg>
